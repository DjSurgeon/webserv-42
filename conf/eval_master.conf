# SERVIDOR PRINCIPAL (Puerto 8080)
server {
  listen 8080;
  server_name webserv42.com localhost;
  root www/eval;

  client_max_body_size 1048576; # Límite de 1MB

  # Páginas de error personalizadas
  error_page 404 /html/404.html;
  error_page 500 /html/50x.html;

  # Ruta base (HTML estático)
  location / {
    index html/index.html;
    autoindex off;
  }

  # Ruta de subidas de archivos (Permite DELETE y POST)
  location /uploads {
    allowed_methods GET POST DELETE;
    autoindex on;
  }

  # Ruta de Ejecución CGI
  location /cgi-bin {
    cgi_ext .py .php;
    allowed_methods GET POST;
  }

  # Ruta Redireccionada
  location /google {
    redirect http://www.google.com;
  }
}

# SERVIDOR SECUNDARIO (Puerto 8081 - Para probar puertos paralelos)
server {
  listen 8081;
  server_name default_server;
  root www/eval/html;

  location / {
    autoindex on;
  }
}
