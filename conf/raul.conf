server {

    listen 8080;
    server_name localhost default;

    root www/default;

    index index.html;

    autoindex off;

    client_max_body_size 1048576;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    location / {

        allowed_methods GET POST DELETE;

    }

    location /uploads {

        root www/uploads;
        allowed_methods GET POST DELETE;
        upload_path ./;

    }

    location /autoindex {

        root www/autoindex;
        autoindex on;

    }

    location /cgi {
        
        allowed_methods GET POST;
        root www/cgi;
        cgi_path /usr/bin/python3;
        cgi_ext .py;

    }

    location /bash {

        root www/bash;
        cgi_path /bin/bash;
        cgi_ext .sh;

    }

    location /redirect {

        return http://youtube.com;

    }

}

server {

    listen 8081;

    server_name second;

    root www/site1;

    index index.html;

}

server {

    listen 8082;

    server_name third;

    root www/site2;

    index index.html;

}