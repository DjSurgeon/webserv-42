<!DOCTYPE html>
<html>
<head>
  <title>Webserv 42 - Evaluation</title>
  <meta charset="UTF-8">
  <style>
    body { font-family: monospace; background: #1a1a1a; color: #00ff00; text-align: center; margin-top: 100px; }
    h1 { font-size: 3em; }
    a { color: #00ffff; }
    hr { border: 0; border-top: 1px solid #454545; margin-left: 25%; margin-right: 25%; }
  </style>
</head>
<body>
  <h1>✅ Webserv 42 Home Page</h1>
  <p>Welcome to the final evaluation environment.</p>
  
  <h2>Autoindex</h2>
  <a href="/uploads">Files Uploaded (Autoindex)</a>
  <hr>

  <h2>Upload file</h2>
  <input type="file" id="file">
  <button onclick="upload()">Upload</button>

  <script>
  async function upload() {
    const file = document.getElementById("file").files[0];
    if (!file) {
      alert("Missing file");
      return;
    }
    await fetch("/uploads/" + file.name, {
        method: "POST",
        headers: {
            "Content-Type": "application/octet-stream"
        },
        body: file
    });
    alert("Upload completed");
  }
  </script>
  <hr>

  <h2>Delete file</h2>
  <input type="text" id="filename" placeholder="Ex: file.txt">
  <button onclick="deleteFile()">Delete</button>
  <script>
  function deleteFile() {
      const file = document.getElementById("filename").value;

      fetch("/uploads/" + file, {
          method: "DELETE"
      })
      .then(async response => {
          const text = await response.text();
          alert("Status code: " + response.status + "\n\n" + text);
      });
  }
  </script>
  <hr>

  <h2>CGIs</h2>
  <a href="/cgi/ok.py">Run Python CGI</a>
  <hr>

  <h2>Custom Error</h2>
  <a href="/non_existing.html">Custom error 404</a>
  <hr>

  <h2>Redirect</h2>
  <a href="/redirect">Test 301 Redirect</a>
</body>
</html>
