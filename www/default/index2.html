<!DOCTYPE html>
<html>
<head>
  <title>Webserv 42 - Evaluation</title>
  <meta charset="UTF-8">
  <style>
    body { font-family: monospace; background: #FFFFFF; color: #1B1B1B; text-align: center; margin-top: 100px; }
    h1 { font-size: 3em; }
    a { color: #00BABC; font-weight: 600;}
    a:hover { color: #EC3391; }
    hr {
        margin-left: 30%;
        margin-right: 30%;
        margin-bottom: 40px;
        border: none;
        height: 2px;
        background: linear-gradient(to right, #EC3391, #96A3EB, #00BABC);
        box-shadow: 0 0 6px #96a3eb6b
    }
    button {
        font-family: monospace;
        background: white;
    }
  </style>
</head>
<body>
  <h1>✅ WEBSERV 42 Home Page</h1>
  <p>Welcome to the final evaluation environment.</p>
  
  <h2>Autoindex</h2>
  <a href="/uploads">Files Uploaded (Autoindex)</a>
  <hr>

  <h2>Upload file</h2>
  <input type="file" id="file">
  <button onclick="upload()">Upload</button>

  <script>
  async function upload() {
    const file = document.getElementById("file").files[0];
    if (!file) {
      alert("Missing file");
      return;
    }
    await fetch("/uploads/" + file.name, {
        method: "POST",
        headers: {
            "Content-Type": "application/octet-stream"
        },
        body: file
    });
    alert("Upload completed");
  }
  </script>
  <hr>

  <h2>Delete file</h2>
  <input type="text" id="filename" placeholder="Ex: file.txt">
  <button onclick="deleteFile()">Delete</button>
  <script>
  function deleteFile() {
      const file = document.getElementById("filename").value;

      fetch("/uploads/" + file, {
          method: "DELETE"
      })
      .then(async response => {
          const text = await response.text();
          alert("Status code: " + response.status + "\n\n" + text);
      });
  }
  </script>
  <hr>

  <h2>CGIs</h2>
  <a href="/cgi/ok.py">Run Python CGI</a>
  <hr>

  <h2>Custom Error</h2>
  <a href="/non_existing.html">Custom error 404</a>
  <hr>

  <h2>Redirect</h2>
  <a href="/redirect">Test 301 Redirect</a>
</body>
</html>
