name: 🤖 Webserv-42 Continuous Integration

# Triggers: Cuándo se ejecuta el robot
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  compile_check:
    name: 🛠️ C++98 Compilation Gatekeeper
    runs-on: ubuntu-latest

    steps:
    # Paso 1: Clonar el código del repositorio en la máquina virtual
    - name: Checkout code
      uses: actions/checkout@v4

    # Paso 2: Asegurar que el compilador estándar esté instalado
    - name: Install compiler (g++)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential g++

    # Paso 3: Ejecutar vuestro Makefile estricto
    - name: Verify strict C++98 compilation
      run: |
        make

    # Paso 4: Verificar que la limpieza de binarios funcione
    - name: Verify project cleanup (fclean)
      run: |
        make fclean
