name: 🤖 Webserv-42 Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  compile_check:
    name: 🛠️ C++98 Compilation Gatekeeper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential

      - name: Build (C++98 strict)
        run: make

      - name: Cleanup
        run: make fclean

  lint:
    name: 🔍 Linter Google (cpplint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cpplint
        run: sudo pip install cpplint

      - name: Run cpplint
        run: cpplint --recursive src/

  format_check:
    name: 🎨 clang-format Style Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          FILES=$(find src -name "*.cpp" -o -name "*.hpp")
          clang-format --dry-run --Werror $FILES

  valgrind:
    name: 🧠 Memory & FD Leak Check (Valgrind)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install valgrind
        run: sudo apt-get install -y valgrind

      - name: Build
        run: make

      - name: Run Valgrind (Leaks + FD)
        run: |
          valgrind \
            --leak-check=full \
            --show-leak-kinds=all \
            --track-fds=yes \
            --error-exitcode=1 \
            ./webserv
